<title>Křížovka pro Kaplera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Barlow+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
  /* ---- světlá paleta: chladný novinový papír, ofsetová modř ---- */
  :root {
    --paper:      #E8EBEE;
    --card:       #FCFCFB;
    --card-2:     #DFE4E8;
    --ink:        #111518;
    --ink-soft:   #4C565E;
    --rule:       #8C959C;
    --rule-soft:  #B9C1C7;
    --taj-fill:   #C2DBEC;
    --taj-ink:    #123E57;
    --hl:         #C6DFF2;
    --hl-taj:     #93C0DE;
    --hl-legend:  #FBF0CE;
    --accent:     #1D5A78;
    --accent-ink: #FFFFFF;
    --good:       #2C6A4E;
    --bad:        #A6392B;
    --cell: 64px;
    --legend-size: 10px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:     #101418;
      --card:      #1B2127;
      --card-2:    #232C33;
      --ink:       #EEF3F6;
      --ink-soft:  #9DA9B2;
      --rule:      #56626B;
      --rule-soft: #39444C;
      --taj-fill:  #1B3F55;
      --taj-ink:   #BEDDEF;
      --hl:        #354C5C;
      --hl-taj:    #37718F;
      --hl-legend: #4A4126;
      --accent:    #7CBEDD;
      --accent-ink:#0C1216;
      --good:      #6FC496;
      --bad:       #E88B7B;
    }
  }
  :root[data-theme="dark"] {
    --paper:     #101418;
    --card:      #1B2127;
    --card-2:    #232C33;
    --ink:       #EEF3F6;
    --ink-soft:  #9DA9B2;
    --rule:      #56626B;
    --rule-soft: #39444C;
    --taj-fill:  #1B3F55;
    --taj-ink:   #BEDDEF;
    --hl:        #354C5C;
    --hl-taj:    #37718F;
    --hl-legend: #4A4126;
    --accent:    #7CBEDD;
    --accent-ink:#0C1216;
    --good:      #6FC496;
    --bad:       #E88B7B;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Source Serif 4", Georgia, serif;
    line-height: 1.55;
  }
  .wrap {
    max-width: 1060px;
    margin: 0 auto;
    padding: 32px 20px 64px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* ---- hlavička ve stylu časopisecké stránky ---- */
  .masthead { display: flex; gap: 18px; align-items: flex-start; }
  .num {
    flex: none;
    width: 74px; height: 74px;
    background: var(--ink); color: var(--paper);
    font-family: Archivo, system-ui, sans-serif;
    font-weight: 800; font-size: 34px;
    display: grid; place-items: center;
    letter-spacing: -0.02em;
  }
  .zadani { flex: 1; min-width: 0; }
  .kicker {
    font-family: "Barlow Condensed", system-ui, sans-serif;
    font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.14em; font-size: 12px;
    color: var(--ink-soft);
    margin: 0 0 4px;
  }
  .zadani p { margin: 0; font-size: 16px; max-width: 62ch; text-wrap: pretty; }
  .zadani .gap {
    background: var(--taj-fill); color: var(--taj-ink);
    padding: 0 6px; font-style: italic; white-space: nowrap;
  }

  /* ---- mřížka ---- */
  .board-scroll { overflow-x: auto; padding-bottom: 4px; }
  .board {
    display: grid; gap: 0;
    border: 2px solid var(--ink);
    background: var(--rule);
    width: max-content;
  }
  .cell {
    width: var(--cell); height: var(--cell);
    border-right: 1px solid var(--rule-soft);
    border-bottom: 1px solid var(--rule-soft);
    background: var(--card);
    position: relative;
    overflow: hidden;
  }
  .cell.legend {
    background: var(--card-2);
    display: flex; flex-direction: column;
    font-family: "Barlow Condensed", system-ui, sans-serif;
    font-weight: 700;
    font-size: var(--legend-size);
    line-height: 1.08;
    text-transform: uppercase;
    color: var(--ink);
    letter-spacing: 0.015em;
  }
  .cell.legend.blind { background: var(--rule-soft); }
  /* dvě definice v jednom políčku dostanou půlku výšky — musí zdrobnět */
  .cell.legend.two { font-size: calc(var(--legend-size) - 1.2px); line-height: 1.02; }
  .clue {
    flex: 1 1 0; min-height: 0;
    padding: 3px 10px 3px 4px;
    position: relative;
    display: flex; align-items: center;
    hyphens: auto;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .clue + .clue { border-top: 1px dotted var(--rule); }
  .clue:hover { background: var(--hl-legend); }
  .clue.on { background: var(--hl-legend); }
  .clue.taj { color: var(--taj-ink); background: var(--taj-fill); }
  .clue.taj.on { background: var(--hl-taj); }
  .clue:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .clue .arrow {
    position: absolute;
    font-size: 11px; line-height: 1;
    color: var(--accent);
  }
  .clue .arrow.right { right: 1px; top: 50%; transform: translateY(-50%); }
  .clue .arrow.down  { right: 1px; bottom: 1px; }

  .cell.letter { padding: 0; }
  .cell.letter.taj { background: var(--taj-fill); }
  .cell.letter.in-word { background: var(--hl); }
  .cell.letter.taj.in-word { background: var(--hl-taj); }
  .cell input {
    width: 100%; height: 100%;
    border: 0; background: transparent;
    text-align: center;
    font-family: Archivo, system-ui, sans-serif;
    font-weight: 700;
    font-size: calc(var(--cell) * 0.44);
    color: var(--ink);
    text-transform: uppercase;
    padding: 0;
    caret-color: var(--accent);
  }
  .cell.letter.taj input { color: var(--taj-ink); }
  .cell input:focus { outline: none; }
  .cell.letter.here { box-shadow: inset 0 0 0 3px var(--accent); }
  .cell.wrong input { color: var(--bad); text-decoration: line-through; }
  .cell.right input { color: var(--good); }

  /* ---- ovládání ---- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button {
    font-family: "Barlow Condensed", system-ui, sans-serif;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    font-size: 13px;
    padding: 9px 16px;
    border: 1.5px solid var(--ink);
    background: transparent; color: var(--ink);
    cursor: pointer;
  }
  button:hover { background: var(--ink); color: var(--paper); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover { filter: brightness(1.12); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .zoom { display: flex; gap: 0; margin-left: auto; }
  .zoom button { padding: 9px 13px; font-size: 15px; line-height: 1; }
  .zoom button + button { border-left: 0; }
  .hint {
    font-size: 13px; color: var(--ink-soft);
    font-family: "Barlow Condensed", system-ui, sans-serif;
    letter-spacing: 0.02em;
    flex-basis: 100%;
  }

  /* ---- tajenka ---- */
  .taj-panel {
    border: 1.5px solid var(--rule);
    padding: 14px 16px;
    background: var(--card);
    display: flex; flex-direction: column; gap: 8px;
  }
  .taj-cells { display: flex; flex-wrap: wrap; gap: 3px; }
  .taj-box {
    width: 26px; height: 30px;
    border: 1px solid var(--rule);
    background: var(--taj-fill); color: var(--taj-ink);
    display: grid; place-items: center;
    font-family: Archivo, system-ui, sans-serif;
    font-weight: 700; font-size: 14px;
  }
  .taj-box.space { border: 0; background: transparent; width: 12px; }
  .status { font-size: 14px; min-height: 1.5em; }
  .status.ok { color: var(--good); font-weight: 600; }
  .status.err { color: var(--bad); font-weight: 600; }

  /* ---- data o vzniku ---- */
  .facts {
    border-top: 2px solid var(--ink);
    padding-top: 14px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px 22px;
  }
  .fact dt {
    font-family: "Barlow Condensed", system-ui, sans-serif;
    text-transform: uppercase; letter-spacing: 0.1em;
    font-size: 11px; font-weight: 700; color: var(--ink-soft);
    margin: 0;
  }
  .fact dd {
    margin: 2px 0 0;
    font-family: Archivo, system-ui, sans-serif;
    font-weight: 700; font-size: 21px;
    font-variant-numeric: tabular-nums;
  }
  .fact dd small {
    display: block; font-family: "Source Serif 4", Georgia, serif;
    font-weight: 400; font-size: 12.5px; color: var(--ink-soft);
    letter-spacing: 0;
  }
  .pomucka {
    font-size: 14px; font-style: italic; color: var(--ink-soft);
    border-top: 1px solid var(--rule-soft); padding-top: 12px;
  }
  .pomucka b { font-style: normal; font-weight: 600; color: var(--ink); }
  .colophon { font-size: 13px; color: var(--ink-soft); }
  .colophon code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px; background: var(--card-2); padding: 1px 5px;
  }

  @media (max-width: 900px) { :root { --cell: 46px; --legend-size: 7.8px; } }
  @media (max-width: 560px) { :root { --cell: 38px; --legend-size: 6.8px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  @media print {
    :root { --cell: 12.4mm; --legend-size: 6.6pt;
            --paper: #fff; --card: #fff; --card-2: #fff;
            --ink: #000; --ink-soft: #333; --rule: #000; --rule-soft: #666;
            --taj-fill: #dceaf4; --taj-ink: #000; --accent: #000;
            --hl: #fff; --hl-taj: #dceaf4; --hl-legend: #fff; }
    .toolbar, .status, .no-print { display: none !important; }
    .wrap { padding: 0; gap: 14px; max-width: none; }
    body { background: #fff; }
    .cell input { color: #000 !important; }
    .cell.letter.here { box-shadow: none; }
  }
</style>

<div class="wrap">
  <header class="masthead">
    <div class="num" id="puzzle-num">1</div>
    <div class="zadani">
      <p class="kicker">Švédská křížovka s tajenkou</p>
      <p id="zadani-text"></p>
    </div>
  </header>

  <div class="board-scroll">
    <div class="board" id="board" role="group" aria-label="Křížovka"></div>
  </div>

  <div class="toolbar no-print">
    <button class="primary" id="btn-check">Zkontrolovat</button>
    <button id="btn-clear">Vymazat</button>
    <button id="btn-reveal">Vzdát to</button>
    <button id="btn-print">Vytisknout</button>
    <span class="zoom">
      <button id="btn-smaller" aria-label="Zmenšit mřížku" title="Zmenšit">A&minus;</button>
      <button id="btn-bigger" aria-label="Zvětšit mřížku" title="Zvětšit">A+</button>
    </span>
    <span class="hint">
      Klikněte na první políčko za definicí — směr psaní se nastaví sám.
      V rohu, kde začínají dvě slova, ho přepnete dalším kliknutím nebo mezerníkem.
      CH patří do jednoho políčka: napište C a hned H.
    </span>
  </div>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <section class="taj-panel">
    <p class="kicker" style="margin:0">Tajenka</p>
    <div class="taj-cells" id="taj-cells"></div>
  </section>

  <section>
    <p class="kicker">Jak mřížka vznikla</p>
    <dl class="facts" id="facts"></dl>
  </section>

  <p class="pomucka" id="pomucka"></p>
  <p class="colophon" id="colophon"></p>
</div>

  // políčko prochází. Luštitel kliká na první písmeno po definici, a tam je
  // směr skoro vždycky jednoznačný: v téhle mřížce začíná 65 políček právě
  // jedno slovo a jen 8 jsou rohy, kde začínají dvě naráz.
  let activeSlot = null;
  let activeCell = null;

  function keyOf(cell) { return cell[0] + "," + cell[1]; }

  const startsHere = new Map();   // "r,c" -> [indexy slov, která tu začínají]
  SLOTS.forEach(function (s, i) {
    const k = keyOf(s.c[0]);
    if (!startsHere.has(k)) startsHere.set(k, []);
    startsHere.get(k).push(i);
  });

  function preferDir(list) {
    const dir = activeSlot !== null ? SLOTS[activeSlot].d : "right";
    const same = list.find(function (s) { return SLOTS[s].d === dir; });
    return same !== undefined ? same : list[0];
  }

  function selectSlot(si, key) {
    activeSlot = si;
    activeCell = key || keyOf(SLOTS[si].c[0]);
    paint();
    const inp = inputs.get(activeCell);
    if (inp) { inp.focus({ preventScroll: false }); inp.select(); }
  }

  function selectCell(key, toggle) {
    const ss = cellWords.get(key) || [];
    if (!ss.length) return;
    const st = startsHere.get(key) || [];
    let target;
    if (toggle && activeCell === key && ss.length > 1) {
      // opakovaný klik na totéž políčko přepne na kolmé slovo
      target = ss.find(function (s) { return s !== activeSlot; });
      if (target === undefined) target = ss[0];
    } else if (st.length === 1) {
      target = st[0];              // začíná tu jediné slovo, o směru není spor
    } else if (st.length > 1) {
      target = preferDir(st);      // roh: začínají dvě, drž dosavadní směr
    } else {
      target = preferDir(ss);      // políčko uprostřed slova
    }
    activeSlot = target;
    activeCell = key;
    paint();
  }

  function paint() {
    board.querySelectorAll(".cell.in-word").forEach(function (e) {
      e.classList.remove("in-word");
    });
    board.querySelectorAll(".cell.here").forEach(function (e) {
      e.classList.remove("here");
    });
    clueEls.forEach(function (e) { if (e) e.classList.remove("on"); });
    if (activeSlot === null) return;
    SLOTS[activeSlot].c.forEach(function (cell) {
      const el = cellEl.get(keyOf(cell));
      if (el) el.classList.add("in-word");
    });
    const cur = cellEl.get(activeCell);
    if (cur) cur.classList.add("here");
    const cl = clueEls[activeSlot];
    if (cl) cl.classList.add("on");
  }

  function posInSlot(si, key) {
    const cells = SLOTS[si].c;
    for (let i = 0; i < cells.length; i++) if (keyOf(cells[i]) === key) return i;
    return -1;
  }

  function stepInSlot(back) {
    if (activeSlot === null) return null;
    const i = posInSlot(activeSlot, activeCell);
    const next = SLOTS[activeSlot].c[i + (back ? -1 : 1)];
    return next ? keyOf(next) : null;
  }

  function goTo(key) {
    if (!key || !inputs.has(key)) return;
    activeCell = key;
    paint();
    const inp = inputs.get(key);
    inp.focus();
    inp.select();
  }

  // ---- vstup --------------------------------------------------------------
  const DEACC = { "Á":"A","Č":"C","Ď":"D","É":"E","Ě":"E","Í":"I","Ň":"N","Ó":"O",
                  "Ř":"R","Š":"S","Ť":"T","Ú":"U","Ů":"U","Ý":"Y","Ž":"Z" };
  function deaccent(s) {
    return s.replace(/[ÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ]/g, function (ch) { return DEACC[ch]; });
  }
  function clearMark(key) {
    const el = cellEl.get(key);
    if (el) el.classList.remove("wrong", "right");
  }

  board.addEventListener("mousedown", function (e) {
    const clue = e.target.closest(".clue");
    if (clue) {
      e.preventDefault();
      selectSlot(Number(clue.dataset.slot));
      return;
    }
    const cell = e.target.closest(".cell.letter");
    if (cell) {
      e.preventDefault();
      selectCell(cell.dataset.key, true);
      const inp = inputs.get(cell.dataset.key);
      if (inp) { inp.focus(); inp.select(); }
    }
  });

  board.addEventListener("keydown", function (e) {
    const clue = e.target.closest(".clue");
    if (clue && (e.key === "Enter" || e.key === " ")) {
      e.preventDefault();
      selectSlot(Number(clue.dataset.slot));
      return;
    }
    const inp = e.target.closest("input");
    if (!inp) return;
    const key = inp.dataset.key;

    if (e.key === " ") {                       // přepnout na kolmé slovo
      e.preventDefault();
      selectCell(key, true);
      return;
    }
    const nav = { ArrowRight: [0, 1], ArrowLeft: [0, -1],
                  ArrowDown: [1, 0], ArrowUp: [-1, 0] };
    if (nav[e.key]) {
      e.preventDefault();
      const parts = key.split(",");
      let r = Number(parts[0]), c = Number(parts[1]);
      for (let i = 0; i < Math.max(W, H); i++) {
        r += nav[e.key][0]; c += nav[e.key][1];
        if (r < 0 || c < 0 || r >= H || c >= W) return;
        const k = r + "," + c;
        if (inputs.has(k)) {
          const want = (e.key === "ArrowRight" || e.key === "ArrowLeft") ? "right" : "down";
          const ss = cellWords.get(k) || [];
          const match = ss.find(function (s) { return SLOTS[s].d === want; });
          if (match !== undefined) { activeSlot = match; }
          goTo(k);
          return;
        }
      }
      return;
    }
    if (e.key === "Backspace" && !inp.value) {
      e.preventDefault();
      const prev = stepInSlot(true);
      if (prev) { inputs.get(prev).value = ""; clearMark(prev); goTo(prev); syncTajenka(); }
    }
  });

  let lastTyped = null;
  board.addEventListener("input", function (e) {
    const inp = e.target;
    if (inp.tagName !== "INPUT") return;
    let v = deaccent(inp.value.toUpperCase()).replace(/[^A-Z]/g, "");

    // CH do jednoho políčka: H hned po C se sloučí zpátky do minulého políčka
    if (v === "H" && lastTyped && lastTyped !== inp.dataset.key) {
      const prev = inputs.get(lastTyped);
      if (prev && prev.value === "C") {
        prev.value = "CH";
        inp.value = "";
        clearMark(lastTyped);
        goTo(lastTyped);
        syncTajenka();
        return;
      }
    }
    if (v.length > 1 && v !== "CH") v = v.slice(-1);
    inp.value = v;
    clearMark(inp.dataset.key);
    syncTajenka();
    if (v) {
      lastTyped = inp.dataset.key;
      if (v !== "C") {
        const next = stepInSlot(false);
        if (next) goTo(next);
      }
    }
  });

  // ---- tajenka ------------------------------------------------------------
  const tajBoxes = [];
  const tajWrap = document.getElementById("taj-cells");
  DATA.tajenka.forEach(function (part, pi) {
    tajCells.filter(function (t) { return t.part === pi; }).forEach(function (t) {
      const b = document.createElement("div");
      b.className = "taj-box";
      tajWrap.appendChild(b);
      tajBoxes.push({ box: b, key: t.key });
    });
    if (pi < DATA.tajenka.length - 1) {
      const sp = document.createElement("div");
      sp.className = "taj-box space";
      tajWrap.appendChild(sp);
    }
  });
  function syncTajenka() {
    tajBoxes.forEach(function (t) { t.box.textContent = inputs.get(t.key).value; });
  }

  // ---- tlačítka -----------------------------------------------------------
  const status = document.getElementById("status");
  function say(msg, kind) {
    status.textContent = msg;
    status.className = "status" + (kind ? " " + kind : "");
  }

  document.getElementById("btn-check").addEventListener("click", function () {
    let filled = 0, wrong = 0;
    inputs.forEach(function (inp, key) {
      const el = cellEl.get(key);
      el.classList.remove("wrong", "right");
      if (!inp.value) return;
      filled++;
      if (inp.value === solution.get(key)) el.classList.add("right");
      else { el.classList.add("wrong"); wrong++; }
    });
    if (!filled) say("Zatím prázdno. Začněte kterýmkoli políčkem.", null);
    else if (wrong) say(wrong + " z " + filled + " vyplněných políček nesedí.", "err");
    else if (filled < inputs.size) say("Zatím vše sedí — zbývá " + (inputs.size - filled) + " políček.", "ok");
    else say("Hotovo, celá křížovka sedí.", "ok");
  });

  document.getElementById("btn-clear").addEventListener("click", function () {
    inputs.forEach(function (inp, key) { inp.value = ""; clearMark(key); });
    syncTajenka();
    say("Vymazáno.", null);
  });

  document.getElementById("btn-reveal").addEventListener("click", function () {
    inputs.forEach(function (inp, key) { inp.value = solution.get(key); clearMark(key); });
    syncTajenka();
    say("Tajenka: " + DATA.tajenka_text, "ok");
  });

  document.getElementById("btn-print").addEventListener("click", function () { window.print(); });

  // ---- velikost mřížky ----------------------------------------------------
  // Legendy jsou drobné a každá obrazovka je jiná, tak ať si to čtenář nastaví.
  const SIZES = [38, 44, 50, 56, 64, 72, 80, 90];
  const LEGEND_AT = { 38: 6.8, 44: 7.6, 50: 8.4, 56: 9.2, 64: 10, 72: 11, 80: 12, 90: 13.5 };
  let sizeIx = 4;
  try {
    const saved = localStorage.getItem("krizovka-size");
    if (saved !== null && SIZES[Number(saved)]) sizeIx = Number(saved);
  } catch (err) { /* soukromé okno, jede se s výchozí velikostí */ }

  function applySize() {
    const px = SIZES[sizeIx];
    document.documentElement.style.setProperty("--cell", px + "px");
    document.documentElement.style.setProperty("--legend-size", LEGEND_AT[px] + "px");
    try { localStorage.setItem("krizovka-size", String(sizeIx)); } catch (err) { /* nevadí */ }
    document.getElementById("btn-smaller").disabled = sizeIx === 0;
    document.getElementById("btn-bigger").disabled = sizeIx === SIZES.length - 1;
  }
  document.getElementById("btn-smaller").addEventListener("click", function () {
    if (sizeIx > 0) { sizeIx--; applySize(); }
  });
  document.getElementById("btn-bigger").addEventListener("click", function () {
    if (sizeIx < SIZES.length - 1) { sizeIx++; applySize(); }
  });
  applySize();

  // ---- texty a čísla ------------------------------------------------------
  document.getElementById("puzzle-num").textContent = DATA.number || "1";
  document.getElementById("zadani-text").innerHTML = DATA.zadani_html;
  document.getElementById("colophon").innerHTML = DATA.colophon_html;

  const facts = document.getElementById("facts");
  DATA.facts.forEach(function (f) {
    const d = document.createElement("div");
    d.className = "fact";
    d.innerHTML = "<dt>" + f.k + "</dt><dd>" + f.v + "<small>" + f.note + "</small></dd>";
    facts.appendChild(d);
  });

  const pom = document.getElementById("pomucka");
  if (DATA.pomucka && DATA.pomucka.length) {
    pom.innerHTML = "<b>Pomůcka:</b> " + DATA.pomucka.join(", ") + ".";
  } else {
    pom.remove();
  }

  syncTajenka();
})();
</script>
